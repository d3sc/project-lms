services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - postgres_network

  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - postgres_network
    depends_on:
      - app

networks:
  postgres_network:
    external: true
    name: go-music-api_default

# PostgreSQL is intentionally not defined here.
# The LMS connects to the existing music_postgres container.
# No project-local database volume is used.
